name: Integrar video de Perez en la webapp
on:
  push:
    paths:
      - '.github/workflows/integrar-vuelo-perez.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Instalar herramientas de vídeo\n        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg\n      - name: Descargar video ya generado de Magnific
        env:
          FUENTE: 'https://pikaso.cdnpk.net/private/production/6122959042/4400800f-22ba-41a3-b86c-3ae6a269d7fc-0.mp4?token=exp=1795737600~hmac=97a9d3e4825b31977386231b652950da96e01d602fc7187ad27d75fb501232dc'
        run: |
          curl -fLsS --retry 3 --connect-timeout 20 "$FUENTE" -o /tmp/vuelo-perez-original.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/vuelo-perez-original.mp4
      - name: Optimizar MP4 para Safari del iPhone
        run: |
          mkdir -p vuelo-magico/assets
          ffmpeg -hide_banner -loglevel error -y -i /tmp/vuelo-perez-original.mp4 -vf 'fps=24,scale=480:-2:flags=lanczos,format=yuv420p' -c:v libx264 -preset medium -crf 24 -movflags +faststart -an vuelo-magico/assets/raton-perez-vuelo.mp4
          test -s vuelo-magico/assets/raton-perez-vuelo.mp4
      - name: Publicar recurso de video en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vuelo-magico/assets/raton-perez-vuelo.mp4
          git diff --cached --quiet || { git commit -m 'assets: incluir video original del globo [skip ci]'; git push; }
