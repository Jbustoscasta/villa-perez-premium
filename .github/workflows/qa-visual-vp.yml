name: QA visual Cámara Mágica (temporal)
# Segunda captura tras corregir el onboarding y la marca móvil
on:
  push:
    paths:
      - '.github/workflows/qa-visual-vp.yml'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Revisar interfaz de bienvenida y cámara en iPhone
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const {spawn}=require('child_process');
          const server=spawn('python3',['-m','http.server','4175','--bind','127.0.0.1'],{stdio:'ignore'});
          (async()=>{
            for(let i=0;i<30;i++){try{const r=await fetch('http://127.0.0.1:4175/vuelo-magico/');if(r.ok)break;}catch{}await new Promise(r=>setTimeout(r,250));}
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const ctx=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});
            const page=await ctx.newPage();page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
            await page.addInitScript(()=>{
              Object.defineProperty(navigator,'mediaDevices',{configurable:true,value:{getUserMedia:async()=>{
                const c=document.createElement('canvas');c.width=360;c.height=640;
                const g=c.getContext('2d');
                g.fillStyle='#1b2b44';g.fillRect(0,0,360,640);
                g.fillStyle='#465570';g.fillRect(50,335,260,130);
                g.fillStyle='#dec6b5';g.beginPath();g.ellipse(150,370,40,29,0,0,Math.PI*2);g.fill();
                return c.captureStream(15);
              }}});
            });
            await page.goto('http://127.0.0.1:4175/vuelo-magico/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.VillaPerezFlight?.version==='1.5.0');
            const first=await page.screenshot({type:'jpeg',quality:55});
            console.log('VP_INTRO_BEGIN'+first.toString('base64')+'VP_INTRO_END');
            await page.locator('#openCameraMain').click();
            await page.waitForFunction(()=>!document.getElementById('cameraShutter').disabled,{timeout:12000});
            const camera=await page.screenshot({type:'jpeg',quality:55});
            console.log('VP_CAMERA_BEGIN'+camera.toString('base64')+'VP_CAMERA_END');
            await b.close();
          })().catch(e=>{console.log('QA_ERROR',e.stack);process.exitCode=1}).finally(()=>server.kill());
          NODE