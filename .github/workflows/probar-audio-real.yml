name: Analizar fuente del sonido real (temporal)
on:
  push:
    paths:
      - '.github/workflows/probar-audio-real.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - name: Analizar fuentes de grabaciones
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, re, html, json
          urls=[
            'https://freesound.org/people/YannSauvin/sounds/778358/',
            'https://freesound.org/embed/sound/iframe/778358/simple/medium/',
            'https://freesound.org/people/Dr.%20Macak/sounds/491300/',
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Test_Balloon.ogv'
          ]
          for u in urls:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=18) as r:
                data=r.read(1500000)
                print('\nSOURCE',u,'status',r.status,'url',r.url,'bytes',len(data),'ct',r.headers.get('Content-Type'))
                if 'html' in str(r.headers.get('Content-Type')):
                  text=data.decode('utf-8','ignore')
                  candidates=re.findall(r'https?[^"\s<>]{0,300}(?:freesound|preview|\.mp3)[^"\s<>]{0,120}',text,re.I)
                  for c in candidates[:30]:print('URL',html.unescape(c)[:350])
                  print('TEXT',text[:200].replace('\n',' '))
            except Exception as e:print('FAILED',u,str(e)[:200])
          PY
