name: Crear sonido natural del globo (una vez)
on:
  push:
    paths:
      - '.github/workflows/build-audio-vuelo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  master:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
      - name: Descargar grabación auténtica CC0 del quemador
        run: |
          curl -fL --retry 3 'https://cdn.freesound.org/previews/778/778358_6921828-hq.mp3' -o /tmp/balloon-burner-real.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/balloon-burner-real.mp3
      - name: Mezclar quemador real con partículas mágicas no melódicas
        run: |
          python3 vuelo-magico/tools/build-sound.py /tmp/balloon-burner-real.mp3 vuelo-magico/assets/sonido-vuelo-real.mp3
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 vuelo-magico/assets/sonido-vuelo-real.mp3
          test -s vuelo-magico/assets/sonido-vuelo-real.mp3
      - name: Publicar una sola vez el master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vuelo-magico/assets/sonido-vuelo-real.mp3
          git diff --cached --quiet || { git commit -m 'audio: grabación real CC0 y magia única [skip ci]'; git push; }
