 <linearGradient id="cream" x1="0%" y1="5%" x2="100%" y2="100%"><stop stop-color="#fffbed"/><stop offset=".32" stop-color="#f0d6a8"/><stop offset=".57" stop-color="#c8a078"/><stop offset=".88" stop-color="#846044"/><stop offset="1" stop-color="#4a3028"/></linearGradient>
