 <linearGradient id="wine" x1="12%" y1="5%" x2="92%" y2="75%"><stop stop-color="#f2a6a0"/><stop offset=".19" stop-color="#b35961"/><stop offset=".47" stop-color="#712e43"/><stop offset=".71" stop-color="#6b3140"/><stop offset="1" stop-color="#2b192e"/></linearGradient>
