 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6dea5"/><stop offset=".29" stop-color="#8e613b"/><stop offset=".59" stop-color="#b48a58"/><stop offset=".84" stop-color="#f7e1ad"/><stop offset="1" stop-color="#694b38"/></linearGradient>
 <radialGradient id="soft" cx=".5" cy=".5" r=".55"><stop stop-color="#ffe5ac" stop-opacity=".75"/><stop offset=".8" stop-color="#a27b55" stop-opacity=".21"/><stop offset="1" stop-color="#7a4c3b" stop-opacity="0"/></radialGradient>
 <pattern id="lines" width="13" height="19" patternUnits="userSpaceOnUse"><path d="M0 1H13" stroke="#7e593b" stroke-opacity=".14" stroke-width=".8"/><path d="M3 11L5 11" stroke="#fff4d6" stroke-opacity=".5"/></pattern>
