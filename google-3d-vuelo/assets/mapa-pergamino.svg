<use href="#hole" fill="none" stroke="#6a4e37" stroke-width="10" stroke-opacity=".9"/>
<use href="#hole" fill="none" stroke="#cf9d54" stroke-width="4"/>
<use href="#hole" fill="none" stroke="#fff1c6" stroke-width="1.4" opacity=".8"/>
<rect x="22" y="22" width="956" height="656" rx="28" fill="none" stroke="#643c2c" stroke-width="3" opacity=".73"/>
<rect x="34" y="34" width="932" height="632" rx="21" fill="none" stroke="#fff1bf" stroke-width="2" opacity=".75"/>
