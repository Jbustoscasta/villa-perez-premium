<!-- A translucent drop shadow on the map plane, never over Google attribution. -->
<rect x="33" y="30" width="934" height="650" rx="39" fill="#211b25" opacity=".35" filter="url(#shadow)"/>
<!-- A carved outer rectangle with a transparent central window. -->
<rect x="7" y="7" width="986" height="686" rx="33" fill="url(#edge)" stroke="#efdfb1" stroke-width="11"/>
